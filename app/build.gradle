plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.xlivetranslate.app'
 compileSdk 34
 defaultConfig { applicationId 'com.xlivetranslate.app'; minSdk 29; targetSdk 34; versionCode 3; versionName '1.2'; ndk { abiFilters 'arm64-v8a' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 packaging { jniLibs.useLegacyPackaging = true; resources.excludes += ['META-INF/AL2.0','META-INF/LGPL2.1'] }
}
dependencies {
 implementation 'com.alphacephei:vosk-android:0.3.47@aar'
 implementation 'net.java.dev.jna:jna:5.13.0@aar'
 implementation 'com.google.mlkit:translate:17.0.3'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
